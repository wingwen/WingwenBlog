# Cloudflare Worker 配置。
#
# 控制台里的项目是 Worker（不是 Pages），所以这里不用 pages_build_output_dir，
# 而是用 Worker 入口 + 静态资源目录：同一个 Worker 既发静态站点，也提供 /api/chat。
#
# 构建命令：npm run build
# 部署命令：npx wrangler deploy
# DEEPSEEK_API_KEY 是机密，不进仓库：用 `npx wrangler secret put DEEPSEEK_API_KEY` 写入。
# 本地开发用 .dev.vars（已被 .gitignore 忽略）。

# 必须与云控制台里的项目名一致，否则 wrangler deploy 找不到项目。
name = "wingwenblog"
main = "src/worker.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# 静态资源：Astro 的构建产物直接由 Worker 托管。
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

# 运行期变量（非机密）：允许调用 /api/chat 的来源。
# 换了域名（例如绑定自定义域名）时改这里再部署。
# DEEPSEEK_API_KEY 不进配置文件，用 `npx wrangler secret put DEEPSEEK_API_KEY` 写入。
[vars]
ALLOWED_ORIGINS = "https://wingwenblog.2592959544.workers.dev"

# D1 绑定：卡每天的总调用额度与单 IP 每分钟的突发。
# 数据库已创建（region APAC，name：wingwen-chat-budget）。
# 绑定名用 CHAT_BUDGET_DB，与 src/worker.ts 里的 env 字段一致。
# 本地开发：`npx wrangler dev --local`，Wrangler 会在 .wrangler/state 下起一份本地 SQLite。
[[d1_databases]]
binding = "CHAT_BUDGET_DB"
database_name = "wingwen-chat-budget"
database_id = "605da921-8de8-46f0-9419-05f29ae5273d"

# 限流绑定只有 Workers 才支持（Pages 配置里会被拒绝），
# 这里不启用：单 IP 限流已由 D1 分钟桶承担，见 src/server/budget.ts。
